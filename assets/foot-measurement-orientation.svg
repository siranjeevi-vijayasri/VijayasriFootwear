<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">Correct A4 paper orientation for foot measurement</title>
<desc id="desc">Use an A4 sheet in portrait or vertical orientation, not landscape or horizontal. Place one bare foot fully on the sheet and take a photo directly from above.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#edf5f0"/></linearGradient>
  <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#eaf0fa"/></linearGradient>
  <linearGradient id="skin" x2="0" y2="1"><stop stop-color="#f4c8a9"/><stop offset="1" stop-color="#d99370"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#21324d" flood-opacity=".14"/></filter>
  <g id="foot" fill="url(#skin)" stroke="#a8654e" stroke-width="3" stroke-linejoin="round">
    <path d="M0 36 C-28 50 -36 92 -31 133 C-26 183 -21 231 -15 263 C-11 288 3 304 22 304 C42 304 55 288 58 262 L70 147 C75 98 64 54 40 37 C29 27 12 27 0 36Z"/>
    <ellipse cx="-20" cy="24" rx="17" ry="23"/><ellipse cx="4" cy="11" rx="16" ry="24"/><ellipse cx="28" cy="15" rx="15" ry="22"/><ellipse cx="49" cy="28" rx="13" ry="19"/><ellipse cx="65" cy="47" rx="11" ry="16"/>
  </g>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="#25446a"/></marker>
</defs>
<rect x="8" y="8" width="1184" height="454" rx="28" fill="url(#bg)" stroke="#d8e4f0" stroke-width="3"/>
<text x="42" y="58" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#18365d">A4 paper position</text>
<!-- Portrait / correct -->
<rect x="28" y="82" width="350" height="348" rx="20" fill="#e8f6ed" stroke="#82c99b" stroke-width="3"/>
<text x="52" y="119" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#17653b">PORTRAIT / VERTICAL</text>
<rect x="108" y="152" width="186" height="263" rx="5" fill="url(#paper)" stroke="#71839c" stroke-width="3" filter="url(#shadow)"/>
<text x="201" y="179" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#52657c">A4</text>
<g transform="translate(171 205) scale(.72 .65)"><use href="#foot"/></g>
<line x1="108" y1="140" x2="294" y2="140" stroke="#25446a" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="201" y="134" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#25446a">210 mm</text>
<line x1="92" y1="152" x2="92" y2="415" stroke="#25446a" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="76" y="286" transform="rotate(-90 76 286)" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#25446a">297 mm</text>
<circle cx="328" cy="111" r="22" fill="#20a45a"/><path d="M317 111 l8 8 15 -18" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="201" y="452" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#17653b">USE THIS</text>
<!-- Landscape / incorrect -->
<rect x="398" y="82" width="360" height="348" rx="20" fill="#fff0ed" stroke="#efaaa1" stroke-width="3"/>
<text x="422" y="119" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#a3322a">LANDSCAPE / HORIZONTAL</text>
<rect x="430" y="205" width="296" height="209" rx="5" fill="url(#paper)" stroke="#71839c" stroke-width="3" filter="url(#shadow)"/>
<text x="578" y="233" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#52657c">A4</text>
<g transform="translate(563 260) scale(.62 .56)"><use href="#foot"/></g>
<line x1="430" y1="188" x2="726" y2="188" stroke="#25446a" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="578" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#25446a">297 mm</text>
<line x1="745" y1="205" x2="745" y2="414" stroke="#25446a" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="742" y="309" transform="rotate(-90 742 309)" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#25446a">210 mm</text>
<circle cx="710" cy="112" r="22" fill="#dc3b35"/><path d="M701 103 l18 18 m0 -18 l-18 18" fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/>
<text x="578" y="452" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#a3322a">DO NOT USE</text>
<!-- Overhead camera illustration -->
<rect x="778" y="82" width="394" height="348" rx="20" fill="#edf2ff" stroke="#a8b9ed" stroke-width="3"/>
<text x="802" y="119" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#25446a">PHOTO FROM ABOVE</text>
<g filter="url(#shadow)">
  <rect x="884" y="145" width="172" height="250" rx="28" fill="#1e2b43" stroke="#71839c" stroke-width="4"/>
  <rect x="897" y="168" width="146" height="202" rx="9" fill="#d8c4a6"/>
  <rect x="916" y="187" width="108" height="164" rx="3" fill="url(#paper)" stroke="#fff" stroke-width="2"/>
  <g transform="translate(948 211) scale(.42 .4)"><use href="#foot"/></g>
  <path d="M911 202 v-8 h18 M1028 202 v-8 h-18 M911 337 v8 h18 M1028 337 v8 h-18" fill="none" stroke="#20a45a" stroke-width="5" stroke-linecap="round"/>
  <circle cx="970" cy="382" r="8" fill="#91a0b7"/>
</g>
<path d="M970 139 V126" stroke="#25446a" stroke-width="4" marker-end="url(#arrow)"/>
<text x="1080" y="211" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#25446a">Keep the</text>
<text x="1080" y="238" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#25446a">whole foot</text>
<text x="1080" y="265" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#25446a">on the sheet</text>
<text x="1080" y="311" font-family="Arial,sans-serif" font-size="18" fill="#52657c">Camera</text>
<text x="1080" y="337" font-family="Arial,sans-serif" font-size="18" fill="#52657c">directly above</text>
</svg>